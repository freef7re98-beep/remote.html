<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flags War Arena - Remote Control</title>
<style>
*{box-sizing:border-box}
body{
margin:0;padding:20px;
font-family:Arial,sans-serif;
background:#0b1020;color:white;
}
.panel{
max-width:420px;margin:25px auto;padding:24px;
background:#171f35;border:1px solid #34415f;
border-radius:20px;
}
h1{text-align:center;font-size:25px;margin:0 0 8px}
.sub{text-align:center;color:#aab8d4;margin-bottom:24px}
label{display:block;margin:16px 0 8px;font-weight:bold}
select,button{
width:100%;padding:14px;border-radius:10px;
font-size:16px;border:0;
}
select{background:#fff;color:#111}
button{font-weight:bold;cursor:pointer;margin-top:14px}
.return{background:#22c55e;color:#06220f}
.shield{background:#38bdf8;color:#062033}
button:disabled{opacity:.5;cursor:wait}
#status{
margin-top:18px;padding:12px;border-radius:10px;
background:#0b1020;color:#dbeafe;
overflow-wrap:anywhere;line-height:1.5;
}
.small{font-size:12px;color:#aab8d4;margin-top:15px;line-height:1.5}
</style>
</head>
<body>
<div class="panel">
<h1>🏟️ FLAGS WAR ARENA</h1>
<div class="sub">REMOTE CONTROL PANEL</div>

<label for="country">Select Country</label>
<select id="country">
<option value="USA">🇺🇸 USA</option>
<option value="India">🇮🇳 India</option>
<option value="United Kingdom">🇬🇧 United Kingdom</option>
<option value="Japan">🇯🇵 Japan</option>
<option value="China">🇨🇳 China</option>
<option value="Russia">🇷🇺 Russia</option>
<option value="Brazil">🇧🇷 Brazil</option>
<option value="Germany">🇩🇪 Germany</option>
<option value="France">🇫🇷 France</option>
<option value="Canada">🇨🇦 Canada</option>
<option value="Australia">🇦🇺 Australia</option>
<option value="Pakistan">🇵🇰 Pakistan</option>
<option value="Nepal">🇳🇵 Nepal</option>
<option value="Bangladesh">🇧🇩 Bangladesh</option>
<option value="South Korea">🇰🇷 South Korea</option>
<option value="North Korea">🇰🇵 North Korea</option>
<option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
<option value="United Arab Emirates">🇦🇪 UAE</option>
<option value="Turkey">🇹🇷 Turkey</option>
<option value="Italy">🇮🇹 Italy</option>
<option value="Spain">🇪🇸 Spain</option>
<option value="Mexico">🇲🇽 Mexico</option>
<option value="Argentina">🇦🇷 Argentina</option>
<option value="Indonesia">🇮🇩 Indonesia</option>
<option value="South Africa">🇿🇦 South Africa</option>
</select>

<button class="return" id="returnBtn" disabled>↩ RETURN COUNTRY</button>
<button class="shield" id="shieldBtn" disabled>🛡️ SHIELD 30s</button>

<div id="status">Connecting to Firebase…</div>
<div class="small">
RETURN restores an eliminated country.<br>
SHIELD protects an active country for 30 seconds.<br>
Automatic elimination continues in the game.
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
appId: "YOUR_APP_ID"
};

const statusBox = document.getElementById("status");
const returnBtn = document.getElementById("returnBtn");
const shieldBtn = document.getElementById("shieldBtn");

let database = null;
let busy = false;

function setStatus(message) {
statusBox.textContent = message;
}

try {
firebase.initializeApp(firebaseConfig);
database = firebase.database();

firebase.auth().signInAnonymously()
.then(() => {
setStatus("✅ Connected. Select a country.");
returnBtn.disabled = false;
shieldBtn.disabled = false;
})
.catch(error => {
setStatus("Sign-in error: " + error.message);
});
} catch (error) {
setStatus("Firebase setup error: " + error.message);
}

async function sendCommand(action) {
if (!database || busy) return;

const country = document.getElementById("country").value;
busy = true;
returnBtn.disabled = true;
shieldBtn.disabled = true;

try {
await database.ref("arenaCommands").push({
action: action,
country: country,
createdAt: Date.now()
});

setStatus(
"✅ Command sent: " + action.toUpperCase() +
" — " + country
);
} catch (error) {
setStatus("Command failed: " + error.message);
} finally {
busy = false;
returnBtn.disabled = false;
shieldBtn.disabled = false;
}
}

returnBtn.addEventListener("click", () => sendCommand("return"));
shieldBtn.addEventListener("click", () => sendCommand("shield"));
</script>

</body>
</html>
